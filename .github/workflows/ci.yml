name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  library:
    name: Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check layout rules
        run: npm run check:layout

      # Run the rule tests on their own first, so a broken rule is distinguishable from a
      # broken engine at a glance. They run again as part of the full suite, which costs
      # seconds and is worth the clearer signal.
      - name: Test lint rules
        run: npm run test:rules

      - name: Test
        run: npm test

  demo:
    name: Demo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: lib
        run: npm install

      - name: Build
        working-directory: lib
        run: npm run build
