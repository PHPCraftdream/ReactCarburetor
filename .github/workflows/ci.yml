name: CI

on:
  push:
    branches: ['ci/**']
    tags: ['sprint-*']
  schedule:
    - cron: '17 2 * * *'   # full tier nightly; runs on the default branch only
  workflow_dispatch:
    inputs:
      force_native:
        description: Run native test + clippy even if this Rust code is already verified
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  library:
    name: Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Pure Node, no install or build: the freeze check blocks before anything heavy runs.
      - name: Gate contract
        run: node perf/ci/contract/check.mjs

      - name: Install
        run: npm ci

      # Only the host binary, not target/: a hit skips the Rust toolchain work entirely.
      # GitHub evicts caches after 7 idle days — a miss just rebuilds, which is fine.
      - name: Native binary cache
        id: native-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: native/target/release/carburetor-lint
          key: native-bin-linux-${{ hashFiles('native/src/**', 'native/Cargo.toml', 'native/Cargo.lock', 'native/build.rs', 'rust-toolchain*') }}

      - name: Check documentation examples are up to date
        run: npm run docs:check

      - name: Check example types
        run: npx tsc --noEmit -p examples/tsconfig.json

      - name: Example coverage of the public API
        run: node node_modules/@rstest/core/bin/rstest.js run __tests__/Tooling/examples/exportCoverage.test.ts

      # The carburetor/* rules are a bridge: `npm run lint` calls this binary to check its
      # own tree, so it has to exist before anything below it runs, not only before the tests.
      # ubuntu-latest ships a Rust toolchain already; the crate's own pins decide the rest.
      - name: Cargo cache
        if: steps.native-bin.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ hashFiles('native/Cargo.lock') }}

      - name: Build native linter
        if: steps.native-bin.outputs.cache-hit != 'true'
        working-directory: native
        run: cargo build --release --locked

      - name: Build
        run: npm run build

      # The gates run last on purpose: one flaky timing ceiling can no longer hide the
      # typecheck, lint or test results that come before it.
      - name: Typecheck
        run: npm run typecheck

      # --type-aware lint loads a full TS program plus tsgolint's Go runtime, which reserves a lot
      # of virtual address space; the kernel's default heuristic overcommit check then refuses the
      # fork() for the small native-lint child even with plenty of RAM actually free.
      - name: Allow full memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Lint
        run: npm run lint

      - name: Check layout rules
        run: npm run check:layout

      # Run the plugin's own tests on their own first, so a broken bridge or a broken house-style
      # rule is distinguishable from a broken engine at a glance. They run again as part of the
      # full suite, which costs seconds and is worth the clearer signal.
      - name: Test lint rules
        run: npm run test:rules

      - name: Test
        run: npm test

      # Mechanism counters plus a few generous absolute ceilings (for example relatedWriteMs <= 10): gates,
      # not benchmarks; the A/B timing comparisons live in Performance validation and are informational.
      # They run last so a flaky timing ceiling can no longer hide the typecheck, lint or test
      # results above it.
      - name: Performance gates
        run: node perf/run.mjs --runs 3 --counter-runs 1

      - name: Install hosted Chrome
        id: chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1

      - name: Actual browser smoke
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: npm run smoke:browser

      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-smoke
          path: worktrees/ci-results/**/browser*
          if-no-files-found: warn

  demo:
    name: Demo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install
        working-directory: lib
        run: npm ci

      - name: Build
        working-directory: lib
        run: npm run build

  # The React 18 half of the advertised peer range (R5-08): the Library job runs the suite
  # on React 19.3 only. This leg swaps React 18.3 into both trees — the root install and the
  # demo app's own copy, whose jsx runtime the lib/src sources resolve, since only exact
  # `react` imports are aliased — and reruns the suite. The whole suite runs here since R6-07:
  # the few AntiHookComponent assertions that observe React's own uncaught-error logging
  # (18 reports the throw and a component stack where 19 logs nothing) and error-replay
  # render counts (18's development replay doubles the retried attempts, 2 → 4) branch on the
  # installed major at runtime, so no file is excluded.
  react-18:
    name: Library on React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Install the demo app
        working-directory: lib
        run: npm ci

      # --no-save: the swap is this job's environment, not a change to what the other jobs
      # build, typecheck and publish against ^19.3. 18.3 is the newest of the advertised
      # 18.x line — the same newest-of-minor the 19.3 job covers — and the oldest line with
      # `act` exported from `react`, which the test harness imports. Coverage note: this pins
      # 18.3.1 exactly; the peer range's 18.0.0 floor and the point releases between are not
      # separately exercised — a gap in coverage, not a claim that they fail.
      - name: Swap in React 18
        run: |
          npm install --no-save react@18.3.1 react-dom@18.3.1
          cd lib && npm install --no-save react@18.3.1 react-dom@18.3.1

      # Built-format regressions need fresh dist; generated bundles are not tracked.
      - name: Build
        run: npm run build

      - name: Test
        run: npx rstest run __tests__/Engine __tests__/Demo __tests__/Tooling/examples

  # Installs the packed tarball into fresh npm/pnpm consumers on React 18 and 19, ESM and CJS:
  # typecheck, render, instanceof the consumer's own React.Component, duplicate-copy diagnostic.
  consumer-matrix:
    name: Consumer matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install
        run: npm ci

      # Only the host binary, not target/: a hit skips the Rust toolchain work entirely.
      # GitHub evicts caches after 7 idle days — a miss just rebuilds, which is fine.
      - name: Native binary cache
        id: native-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: native/target/release/carburetor-lint
          key: native-bin-linux-${{ hashFiles('native/src/**', 'native/Cargo.toml', 'native/Cargo.lock', 'native/build.rs', 'rust-toolchain*') }}

      # The carburetor/* rules are a bridge: `npm run lint` calls this binary to check its
      # own tree, so it has to exist before anything below it runs, not only before the tests.
      # ubuntu-latest ships a Rust toolchain already; the crate's own pins decide the rest.
      - name: Cargo cache
        if: steps.native-bin.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ hashFiles('native/Cargo.lock') }}

      - name: Build native linter for packed lint consumers
        if: steps.native-bin.outputs.cache-hit != 'true'
        working-directory: native
        run: cargo build --release --locked

      - name: Consumer matrix
        run: npm run test:consumers

      # hooks43 needs the .consumer-matrix cells; --require-all turns a missing cell into a
      # failure here, where test:consumers has just created them (Library skips instead).
      - name: SSR performance gates
        run: node perf/run.mjs --only hooks43 --runs 3 --counter-runs 1 --require-all

      - name: Allow native lint child fork with Oxlint's parser reservation
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Packed optional lint preset smoke
        run: npm run smoke:packed-lint

      - name: Upload packed lint proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packed-lint-smoke
          path: worktrees/ci-results/**/packed-lint*
          if-no-files-found: warn

  # The packed library, built once for the jobs that install it on other runtimes.
  library-tarball:
    name: Library tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      # prepack builds dist/.
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP/pack"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: library-tarball
          path: ${{ runner.temp }}/pack/*.tgz

  # The oldest Node the package declares in engines.node, the newest release of that line, and the
  # newest Node there is: the packed tarball is installed with that runtime's own npm and loaded as
  # CJS and ESM, development and production builds, with a store write and a server render.
  node-floor:
    name: Node ${{ matrix.node }}
    needs: library-tarball
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.0.0', '24', 'latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: library-tarball
          path: ${{ runner.temp }}/pack

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install the tarball into a fresh project
        run: |
          set -e
          mkdir "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP"/pack/*.tgz react@18 react-dom@18
          cp "$GITHUB_WORKSPACE/scripts/tools/release/ci/floorProbe/probe.cjs" .

      - name: Load and use every build
        working-directory: ${{ runner.temp }}/consumer
        run: |
          set -e
          for flavor in require-development require-production import-development import-production; do
            node probe.cjs "$flavor"
          done

  native:
    name: Native linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The image's toolchain is part of the verified state: an upgrade must rerun, not skip.
      - name: Rust toolchain version
        id: rustc
        run: echo "version=$(rustc -V)" >> "$GITHUB_OUTPUT"

      # test + clippy only need to pass once per version of the Rust inputs: the
      # marker cache records that and later runs skip straight through. GitHub
      # evicts caches after 7 idle days — a miss just reruns the checks. Test-only
      # changes and toolchain upgrades now rerun too.
      - name: Verified marker
        id: marker
        uses: actions/cache/restore@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: .native-verified
          key: native-verified-${{ steps.rustc.outputs.version }}-${{ hashFiles('native/src/**', 'native/tests/**', 'native/Cargo.toml', 'native/Cargo.lock', 'native/build.rs', 'rust-toolchain*') }}

      # inputs.force_native is empty outside workflow_dispatch, so only an explicit
      # dispatch with the flag forces a rerun over an existing marker.
      - name: Decide whether the checks must run
        id: gate
        shell: bash
        run: |
          if [ "${{ steps.marker.outputs.cache-hit }}" = "true" ] && [ "${{ inputs.force_native }}" != "true" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      # The toolchain the image ships is enough: the crate pins its dependencies, not rustc.
      - name: Cargo cache
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ hashFiles('native/Cargo.lock') }}

      - name: Build
        if: steps.gate.outputs.run == 'true'
        working-directory: native
        run: cargo build --release --locked

      # The integration tests run the built binary, so they cover the command line, the walk
      # and the exit codes — the parts a unit test cannot see.
      - name: Test
        if: steps.gate.outputs.run == 'true'
        working-directory: native
        run: cargo test --locked

      - name: Clippy
        if: steps.gate.outputs.run == 'true'
        working-directory: native
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Record the verified marker
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p .native-verified
          date > .native-verified/marker

      - name: Save the verified marker
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache/save@d4323d4df104b026a6aa633fdb11d772146be0bf # v4
        with:
          path: .native-verified
          key: native-verified-${{ steps.rustc.outputs.version }}-${{ hashFiles('native/src/**', 'native/tests/**', 'native/Cargo.toml', 'native/Cargo.lock', 'native/build.rs', 'rust-toolchain*') }}

  # The published platform packages: every leg builds, checks, runs, packs and installs one
  # binary. A reusable workflow, so a platform leg can also be run alone while it is tuned.
  native-packages:
    name: Native packages
    uses: ./.github/workflows/native-packages.yml
