name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  library:
    name: Library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      # The 22 carburetor/* rules are a bridge now: `npm run lint` calls this binary to check its
      # own tree, so it has to exist before anything below it runs, not only before the tests.
      # ubuntu-latest ships a Rust toolchain already; the crate's own pins decide the rest.
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ hashFiles('native/Cargo.lock') }}

      - name: Build native linter
        working-directory: native
        run: cargo build --release

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # --type-aware lint loads a full TS program plus tsgolint's Go runtime, which reserves a lot
      # of virtual address space; the kernel's default heuristic overcommit check then refuses the
      # fork() for the small native-lint child even with plenty of RAM actually free.
      - name: Allow full memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Lint
        run: npm run lint

      - name: Check layout rules
        run: npm run check:layout

      # Run the plugin's own tests on their own first, so a broken bridge or a broken house-style
      # rule is distinguishable from a broken engine at a glance. They run again as part of the
      # full suite, which costs seconds and is worth the clearer signal.
      - name: Test lint rules
        run: npm run test:rules

      - name: Test
        run: npm test

  demo:
    name: Demo app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        working-directory: lib
        run: npm ci

      - name: Build
        working-directory: lib
        run: npm run build

  # The React 18 half of the advertised peer range (R5-08): the Library job runs the suite
  # on React 19.3 only. This leg swaps React 18.3 into both trees — the root install and the
  # demo app's own copy, whose jsx runtime the lib/src sources resolve, since only exact
  # `react` imports are aliased — and reruns the suite. One AntiHookComponent test file stays
  # excluded here because its expectations are version-sensitive rather than broken on 18:
  # two of its tests trip the console guard because React 18 logs render throws ("The above
  # error occurred in ...") where React 19 does not, and one counts render attempts that
  # React 18's development replay doubles. The file runs in full on the 19.3 leg above.
  react-18:
    name: Library on React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Install the demo app
        working-directory: lib
        run: npm ci

      # --no-save: the swap is this job's environment, not a change to what the other jobs
      # build, typecheck and publish against ^19.3. 18.3 is the newest of the advertised
      # 18.x line — the same newest-of-minor the 19.3 job covers — and the oldest line with
      # `act` exported from `react`, which the test harness imports.
      - name: Swap in React 18
        run: |
          npm install --no-save react@18.3.1 react-dom@18.3.1
          cd lib && npm install --no-save react@18.3.1 react-dom@18.3.1

      - name: Test
        run: npx rstest run __tests__/Engine __tests__/Demo --exclude __tests__/Engine/Component/AntiHookComponent.test.tsx

  native:
    name: Native linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The toolchain the image ships is enough: the crate pins its dependencies, not rustc.
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ hashFiles('native/Cargo.lock') }}

      - name: Build
        working-directory: native
        run: cargo build --release

      # The integration tests run the built binary, so they cover the command line, the walk
      # and the exit codes — the parts a unit test cannot see.
      - name: Test
        working-directory: native
        run: cargo test

      - name: Clippy
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings

  # The six published platform packages. Each leg builds one cargo target, then runs the
  # produced binary there — compiling for a target proves nothing about the artefact, running
  # it does — and finally drops the binary into its package directory and packs it for a
  # maintainer to publish by hand.
  native-packages:
    name: Package ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: carburetor-lint-win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: .exe
          - package: carburetor-lint-darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - package: carburetor-lint-darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - package: carburetor-lint-linux-x64-gnu
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - package: carburetor-lint-linux-x64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            apt: musl-tools
            linker_var: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
            linker: musl-gcc
          - package: carburetor-lint-linux-arm64-gnu
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu qemu-user-static
            linker_var: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER
            linker: aarch64-linux-gnu-gcc
            emulator: qemu-aarch64-static
    steps:
      - uses: actions/checkout@v4

      # The cross legs need a linker that speaks the target's ABI; qemu-user-static doubles as
      # the way to execute the arm64 artefact, since installing it registers binfmt. Running an
      # aarch64 binary under qemu-user still needs an aarch64 dynamic linker on disk, which is why
      # the arm64 leg also pulls in the multiarch runtime libs.
      - name: Install the cross toolchain
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      # qemu-user only needs the arm64 ld.so and libc on disk to execute a foreign binary; a real
      # `apt-get install libc6:arm64` drags in dpkg's cross-arch version-parity `Breaks:` rules and
      # apt tries to reconcile the whole base system against them. Downloading the .deb and
      # unpacking it with dpkg -x sidesteps the dependency resolver entirely.
      - name: Install the aarch64 runtime libraries
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          sudo apt-get update -o Dir::Etc::sourcelist="sources.list.d/arm64-ports.list" -o Dir::Etc::sourceparts="-"
          cd "$RUNNER_TEMP"
          apt-get download libc6:arm64 libgcc-s1:arm64
          sudo dpkg -x libc6_*.deb /
          sudo dpkg -x libgcc-s1_*.deb /

      # Matrix keys cannot be environment variable NAMES, so the linker reaches cargo through
      # the environment file instead.
      - name: Point cargo at the cross linker
        if: matrix.linker
        run: echo "${{ matrix.linker_var }}=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Add the cargo target
        run: rustup target add ${{ matrix.target }}

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-packages-${{ matrix.target }}-${{ hashFiles('native/Cargo.lock') }}

      - name: Build
        working-directory: native
        run: cargo build --release --target ${{ matrix.target }}

      # `--help` exercises the dynamic loader; the fixture lint exercises the walk, the parser
      # and the exit codes. reads.tsx carries known violations, so exit 1 with the rule id on
      # stdout is the passing outcome, and anything else fails the step.
      - name: Run the binary on this target
        shell: bash
        run: |
          set -e
          BIN="native/target/${{ matrix.target }}/release/carburetor-lint${{ matrix.bin_ext }}"
          ${{ matrix.emulator }} "$BIN" --help
          set +e
          OUT=$(${{ matrix.emulator }} "$BIN" --format=json --rule no-get-data-in-render=error plugin/__fixtures__/reads.tsx)
          CODE=$?
          set -e
          [ "$CODE" -eq 1 ] || { echo "expected exit 1 (findings), got $CODE" >&2; exit 1; }
          echo "$OUT" | grep -q no-get-data-in-render || { echo "expected the fixture's violation in the output" >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Pack the platform package
        shell: bash
        run: |
          set -e
          cp "native/target/${{ matrix.target }}/release/carburetor-lint${{ matrix.bin_ext }}" "npm/${{ matrix.package }}/"
          cd "npm/${{ matrix.package }}"
          npm pack
          # No -q: it exits the moment it finds a match, leaving tar to write into a closed pipe
          # and fail with SIGPIPE under `set -e -o pipefail`, even when the check itself passes.
          tar -tf *.tgz | grep "package/carburetor-lint" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: npm/${{ matrix.package }}/*.tgz
