name: Performance validation

on:
  push:
    branches: ['ci/**']
    paths-ignore:
      - 'perf/ci/scenarios/diagnostics.mjs'
      - 'perf/ci/scenarios/trace.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/timing-diagnostics.yml'
  workflow_dispatch:
    inputs:
      baseline:
        description: Previous release point the current tree is compared against
        required: true
        default: 90829af804a64e0692abfb0917e03e281f49d9ef
        type: string
      gainsBaseline:
        description: Commit before the round-44 gains the mechanism calibration rejects
        required: false
        default: acfd3e2b8e58210ce1076bf1683f666283216af5
        type: string
      runs:
        description: Independent alternating samples per build (at least 3)
        required: true
        default: '5'
        type: string
      metadataBaseline:
        description: Optional commit before the direct-capture allocation regression fix
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite is spread over one runner per phase part, each held to five minutes: a part that
  # outgrows it fails instead of slowing every push. The parts run on Linux, where the account gets
  # enough concurrent runners for all of them at once; on Windows they queued four to six at a time. perf/shards.json holds the per-entry costs the
  # parts are balanced by (perf/harness/sampling.mjs, shardOf); regenerate it when parts drift.
  gates:
    name: ${{ matrix.phase }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - {phase: gains, shard: ''}
          - {phase: current, shard: 1/4}
          - {phase: current, shard: 2/4}
          - {phase: current, shard: 3/4}
          - {phase: current, shard: 4/4}
          - {phase: controls, shard: 1/4}
          - {phase: controls, shard: 2/4}
          - {phase: controls, shard: 3/4}
          - {phase: controls, shard: 4/4}
          - {phase: previous, shard: 1/7}
          - {phase: previous, shard: 2/7}
          - {phase: previous, shard: 3/7}
          - {phase: previous, shard: 4/7}
          - {phase: previous, shard: 5/7}
          - {phase: previous, shard: 6/7}
          - {phase: previous, shard: 7/7}
    env:
      BENCH_BASELINE: ${{ inputs.baseline || '90829af804a64e0692abfb0917e03e281f49d9ef' }}
      BENCH_GAINS_BASELINE: ${{ inputs.gainsBaseline || 'acfd3e2b8e58210ce1076bf1683f666283216af5' }}
      BENCH_METADATA_BASELINE: ${{ inputs.metadataBaseline }}
      BENCH_RUNS: ${{ inputs.runs || '5' }}
      BENCH_COUNTER_RUNS: '1'
      BENCH_PHASE: ${{ matrix.phase }}
      BENCH_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build all current library formats
        run: npm run build

      # gains: exact pre-fix/fixed mechanism calibration; current: every gate on this build;
      # controls: completed-operation A/B (timing flags informational); previous: unchanged baseline
      # contracts (blocking) with an informational timing comparison.
      - name: Measure the phase part
        run: |
          if [ "$BENCH_PHASE" = gains ]; then reference=(--gains-baseline "$BENCH_GAINS_BASELINE"); else reference=(--baseline "$BENCH_BASELINE"); fi
          part=()
          if [ -n "$BENCH_SHARD" ]; then part=(--shard "$BENCH_SHARD"); fi
          npm run bench:ci -- --phase "$BENCH_PHASE" "${reference[@]}" --runs "$BENCH_RUNS" "${part[@]}"

      - name: Upload exact samples, flags and command receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-${{ matrix.phase }}-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: worktrees/ci-results/
          if-no-files-found: warn
          retention-days: 30

  # The release binary's own runner: the lint-binary gates, which need it, and the fixed-iteration
  # benchmarks. Cargo's registry and target are cached by lockfile, so a push recompiles the crate only.
  native:
    name: native linter gates and benchmarks
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: perf-cargo-windows-${{ hashFiles('native/Cargo.lock') }}
          # A new lockfile still starts from the last build's dependencies.
          restore-keys: perf-cargo-windows-

      # bench-scale-tool runs each workload the count pinned in native/bench-iters.txt, scaled by
      # BENCH_SCALE; the bench build is the release binary the gates below run. The timings are
      # informational; the step fails only when a generated corpus is not analysed as expected.
      - name: Native linter benchmarks (timings informational)
        working-directory: native
        env:
          BENCH_SCALE: '0.5'
        run: |
          cargo bench --locked --bench lint | Tee-Object -FilePath "$env:RUNNER_TEMP/native-bench.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_STEP_SUMMARY "### Native linter benchmarks (fixed iterations, scale 0.5)"
          Add-Content $env:GITHUB_STEP_SUMMARY '```text'
          Get-Content "$env:RUNNER_TEMP/native-bench.txt" | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'

      - name: Install locked dependencies
        run: npm ci

      - name: Build all current library formats
        run: npm run build

      - name: Lint-binary gates
        run: node perf/run.mjs --only lint-binary --runs 3 --require-all
