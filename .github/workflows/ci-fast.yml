name: CI fast

# The fast tier: runs the affected subset on every push and PR. `scripts/affected.mjs`
# decides what to run, so paths-ignore is deliberately absent — a docs-only change still
# needs the plan step to prove it is docs-only.
on:
  push:
    branches-ignore: ['ci/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      docsOnly: ${{ steps.plan.outputs.docsOnly }}
      native: ${{ steps.plan.outputs.native }}
      rstest: ${{ steps.plan.outputs.rstest }}
      examples: ${{ steps.plan.outputs.examples }}
      perfAreas: ${{ steps.plan.outputs.perfAreas }}
      react18: ${{ steps.plan.outputs.react18 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history: the selector diffs against a base commit.
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # No npm ci: the selector has no dependencies by design, so the plan stays cheap.
      - name: Compute the base ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git merge-base origin/master HEAD) || BASE="${{ github.sha }}~1"
            else
              BASE="$BEFORE"
            fi
          fi
          # Env names are case-sensitive: an unset BASE made the selector see no changes and skip the tests.
          [ -n "$BASE" ] || { echo "empty plan base" >&2; exit 1; }
          echo "BASE=$BASE" >> "$GITHUB_ENV"

      - name: Plan
        id: plan
        shell: bash
        run: |
          node scripts/affected.mjs --base "$BASE" --json > "$RUNNER_TEMP/plan.json"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const plan = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, "plan.json"), "utf8"));
            const out = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(out, `full=${plan.full}\n`);
            fs.appendFileSync(out, `docsOnly=${plan.docsOnly}\n`);
            fs.appendFileSync(out, `react18=${plan.react18}\n`);
            fs.appendFileSync(out, `native=${plan.native}\n`);
            fs.appendFileSync(out, `rstest=${(plan.rstest || []).join(" ")}\n`);
            fs.appendFileSync(out, `examples=${plan.examples}\n`);
            fs.appendFileSync(out, `perfAreas=${JSON.stringify(plan.perfAreas || [])}\n`);
            let summary = "## Plan\n\n";
            summary += "- full: " + plan.full + "\n";
            summary += "- docsOnly: " + plan.docsOnly + "\n";
            summary += "- react18: " + plan.react18 + "\n";
            summary += "- native: " + plan.native + "\n";
            summary += "- rstest: " + (plan.rstest || []).join(", ") + "\n";
            summary += "- examples: " + plan.examples + "\n";
            summary += "- perfAreas: " + (plan.perfAreas || []).join(", ") + "\n\n";
            summary += "### Reasons\n\n" + (plan.reasons || []).map(r => "- " + r).join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '

  examples:
    name: Examples
    needs: plan
    if: needs.plan.outputs.examples == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install
        run: npm ci


      - name: Check documentation examples are up to date
        run: npm run docs:check

      - name: Check example types
        run: npx tsc --noEmit -p examples/tsconfig.json

      - name: Example coverage of the public API
        run: node node_modules/@rstest/core/bin/rstest.js run __tests__/Tooling/examples

  checks:
    name: Checks
    needs: plan
    if: needs.plan.outputs.docsOnly != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Pure Node, no install or build: a gate or frozen-file edit needs an amendment (perf/README.md).
      - name: Gate contract
        run: node perf/ci/contract/check.mjs

      - name: Install
        run: npm ci

      # Only the host binary, not target/: a hit skips the Rust toolchain work entirely.
      # GitHub evicts caches after 7 idle days — a miss just rebuilds, which is fine.
      - name: Native binary cache
        id: native-bin
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: native/target/release/carburetor-lint
          key: native-bin-linux-${{ hashFiles('native/src/**', 'native/Cargo.toml', 'native/Cargo.lock', 'native/build.rs', 'rust-toolchain*') }}

      # The carburetor/* rules are a bridge: `npm run lint` calls this binary, so it has to
      # exist before lint runs. ubuntu-latest ships a Rust toolchain already.
      - name: Cargo cache
        if: steps.native-bin.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ hashFiles('native/Cargo.lock') }}

      - name: Build native linter
        if: steps.native-bin.outputs.cache-hit != 'true'
        working-directory: native
        run: cargo build --release --locked

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      # See the full tier (ci.yml): tsgolint reserves a lot of virtual address space and the
      # default overcommit heuristic refuses the fork() for the native-lint child.
      - name: Allow full memory overcommit
        run: sudo sysctl -w vm.overcommit_memory=1

      - name: Lint
        run: npm run lint

      - name: Check layout rules
        run: npm run check:layout

      - name: Test lint rules
        run: npm run test:rules

      # Full suite only when the selector says the change is too broad to narrow down.
      - name: Test
        if: needs.plan.outputs.full == 'true'
        run: npm test

      # Otherwise just the suites the changed files can actually affect.
      - name: Test affected suites
        if: needs.plan.outputs.full != 'true' && needs.plan.outputs.rstest != ''
        run: npx rstest run ${{ needs.plan.outputs.rstest }}

  # A fast-tier React 18 leg: the swap costs minutes and Interop/Component changes are
  # exactly the ones that can quietly break the older major.
  react-18:
    name: Library on React 18
    needs: plan
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.react18 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Install the demo app
        working-directory: lib
        run: npm ci

      - name: Swap in React 18
        run: |
          npm install --no-save react@18.3.1 react-dom@18.3.1
          cd lib && npm install --no-save react@18.3.1 react-dom@18.3.1

      - name: Build
        run: npm run build

      - name: Test
        run: npx rstest run __tests__/Engine __tests__/Demo __tests__/Tooling/examples

  perf:
    name: Performance gates
    needs: [plan, checks]
    if: needs.plan.outputs.docsOnly != 'true' && (needs.plan.outputs.full == 'true' || fromJSON(needs.plan.outputs.perfAreas || '[]')[0] != null)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      # perf/run.mjs needs a built dist (esm-prod) to run the scenarios against.
      - name: Build
        run: npm run build

      # Mechanism counters and a few generous absolute ceilings; exit 1 only on a gate violation.
      - name: Performance gates (full sweep)
        if: needs.plan.outputs.full == 'true'
        run: node perf/run.mjs --runs 3 --counter-runs 1

      # One --only per affected area. A selector area that matches no entry fails the run —
      # acceptable, since the selector and the gate names are kept in sync.
      - name: Performance gates (affected areas)
        if: needs.plan.outputs.full != 'true'
        env:
          AREAS_JSON: ${{ needs.plan.outputs.perfAreas }}
        run: |
          AREAS=$(node -e "console.log(JSON.parse(process.env.AREAS_JSON).join(' '))")
          for area in $AREAS; do
            node perf/run.mjs --only "$area" --runs 3 --counter-runs 1 || exit 1
          done

  native:
    name: Native linter
    needs: plan
    if: needs.plan.outputs.native == 'true' || needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The toolchain the image ships is enough: the crate pins its dependencies, not rustc.
      - name: Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-${{ hashFiles('native/Cargo.lock') }}

      - name: Build
        working-directory: native
        run: cargo build --release --locked

      # The integration tests run the built binary, so they cover the command line, the walk
      # and the exit codes — the parts a unit test cannot see.
      - name: Test
        working-directory: native
        run: cargo test --locked

      - name: Clippy
        working-directory: native
        run: cargo clippy --locked --all-targets -- -D warnings

  # The fast tier covers full, affected and skipped runs alike; every job above must either
  # succeed or be deliberately skipped, and plan must never fail.
  fast-gate:
    name: Fast gate
    needs: [plan, checks, react-18, perf, native, examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate
        shell: bash
        run: |
          failed=0
          for result in "${{ needs.plan.result }}" "${{ needs.checks.result }}" \
            "${{ needs.react-18.result }}" "${{ needs.perf.result }}" "${{ needs.native.result }}" "${{ needs.examples.result }}"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              failed=1
            fi
          done
          echo "plan=${{ needs.plan.result }} checks=${{ needs.checks.result }} react-18=${{ needs.react-18.result }} perf=${{ needs.perf.result }} native=${{ needs.native.result }} examples=${{ needs.examples.result }}"
          [ "$failed" -eq 0 ] || exit 1
