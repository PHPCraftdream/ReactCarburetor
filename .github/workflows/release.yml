name: Release

# Manual only: a publish is never a side effect of a push or a tag. Setup and the two
# authentication modes are described in docs/releasing.md.
on:
  workflow_dispatch:
    inputs:
      auth:
        description: How to authenticate to npm
        type: choice
        options: [trusted, token]
        default: trusted
      dry_run:
        description: Pack and verify everything, publish nothing
        type: boolean
        default: true
      dist_tag:
        description: npm dist-tag for the published versions
        type: string
        default: latest

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Verify the commit
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      # Reads the CI runs, and starts the full tier when this commit has none.
      actions: write
    outputs:
      ci_run: ${{ steps.ci.outputs.run }}
      version: ${{ steps.versions.outputs.version }}
      platforms: ${{ steps.versions.outputs.platforms }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # ci.yml is the full tier (dispatch / nightly / tags / ci/** branches). A push to master only
      # runs the fast tier, so a commit that has no full run yet gets one here, started on this
      # very commit, and the release waits for it. A red run stops the release.
      - name: Require a green full-tier CI run for this commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          run=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success \
            --json databaseId --jq '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "no successful full-tier CI run for $GITHUB_SHA; starting one"
            started=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            gh workflow run ci.yml --ref master
            for attempt in $(seq 1 30); do
              run=$(gh run list --workflow ci.yml --event workflow_dispatch --branch master --limit 20 \
                --json databaseId,headSha,createdAt \
                --jq "[.[] | select(.headSha == \"$GITHUB_SHA\" and .createdAt >= \"$started\")][0].databaseId // empty")
              [ -n "$run" ] && break
              sleep 10
            done
            if [ -z "$run" ]; then
              echo "the dispatched CI run for $GITHUB_SHA did not appear; master may have moved on" >&2
              exit 1
            fi
            echo "waiting for CI run $run"
            gh run watch "$run" --exit-status --interval 60
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Версии пакетов и optionalDependencies должны совпадать.
      # Для публикации нужен датированный changelog; dry run допускает Unreleased.
      # Список платформ берётся из launcher.
      - name: Check that the package versions and the changelog agree
        id: versions
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node -e '
            const fs = require("fs");
            const read = p => JSON.parse(fs.readFileSync(p, "utf8"));
            const root = read("package.json");
            const lint = read("npm/lint/package.json");
            const platforms = Object.keys(lint.optionalDependencies);
            const bad = [];
            for (const name of platforms) {
              const manifest = read(`npm/${name.split("/").pop()}/package.json`);
              if (manifest.name !== name || manifest.version !== root.version) bad.push(name);
              if (lint.optionalDependencies[name] !== root.version) bad.push(`optional ${name}`);
            }
            if (lint.version !== root.version) bad.push("@react-carburetor/lint");
            const heading = new RegExp(`^## \\[${root.version.replace(/\./g, "\\.")}\\] - \\d{4}-\\d{2}-\\d{2}$`, "m");
            const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
            const unreleasedDryRun = process.env.DRY_RUN === "true" && /^## \[Unreleased\]$/m.test(changelog);
            if (!heading.test(changelog) && !unreleasedDryRun) {
              bad.push(`CHANGELOG.md has no "## [${root.version}] - YYYY-MM-DD" section`);
            }
            if (!heading.test(changelog) && unreleasedDryRun) {
              console.log("Dry run uses [Unreleased]; publishing still requires a dated version section.");
            }
            if (bad.length) { console.error("version mismatch:", bad.join(", ")); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${root.version}\nplatforms=${platforms.join(" ")}\n`);
          '

  audit:
    name: Audit dependencies
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/audit.yml

  publish:
    name: Publish ${{ needs.prepare.outputs.version }} (${{ inputs.auth }}${{ inputs.dry_run && ', dry run' || '' }})
    needs: [prepare, audit]
    runs-on: ubuntu-latest
    # The environment is where reviewers can be required, and where a trusted publisher on
    # npmjs.com is told to expect this job. Its name must match that configuration.
    environment: npm
    permissions:
      contents: read
      actions: read
      # OIDC: the trusted-publisher exchange and the provenance attestation.
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PLATFORMS: ${{ needs.prepare.outputs.platforms }}
      DIST_TAG: ${{ inputs.dist_tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # No registry-url: setup-node would export a placeholder NODE_AUTH_TOKEN, which npm can
      # take for a real token and skip the OIDC exchange. Credentials are written below, and
      # only in token mode.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # Trusted publishing needs npm 11.5.1 or newer; fail here, not halfway through the list.
      - name: Check the npm version
        run: |
          node -e '
            const v = require("child_process").execSync("npm --version", {encoding: "utf8"}).trim();
            const [major, minor, patch] = v.split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            console.log("npm", v);
            if (!ok) { console.error("npm >= 11.5.1 is required for trusted publishing"); process.exit(1); }
          '

      - name: Token credentials
        if: inputs.auth == 'token'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "NPM_TOKEN is not set; continuing because this is a dry run"
              exit 0
            fi
            echo "secret NPM_TOKEN is not set" >&2
            exit 1
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$RUNNER_TEMP/npmrc"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/npmrc" >> "$GITHUB_ENV"

      - name: Download the platform packages built by CI
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN: ${{ needs.prepare.outputs.ci_run }}
        run: |
          set -e
          gh run download "$CI_RUN" --pattern 'lint-*' --dir artifacts
          for name in $PLATFORMS; do
            [ -d "artifacts/${name##*/}" ] || { echo "CI run $CI_RUN produced no artifact for $name" >&2; exit 1; }
          done

      - name: Install
        run: npm ci

      # prepack builds dist/ for the library; the launcher has no build step.
      - name: Pack the library and the launcher
        run: |
          mkdir -p artifacts/core artifacts/lint
          npm pack --pack-destination artifacts/core
          npm pack ./npm/lint --pack-destination artifacts/lint

      # Each tarball must hold what its package promises before anything is published.
      - name: Inspect the tarballs
        run: |
          set -e
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tgz=$(ls "$dir"*.tgz)
            echo "== $name: $tgz"
            tar -tf "$tgz" > "$RUNNER_TEMP/files.txt"
            cat "$RUNNER_TEMP/files.txt"
            grep -q '^package/LICENSE$' "$RUNNER_TEMP/files.txt"
            grep -q '^package/LICENSE-MIT$' "$RUNNER_TEMP/files.txt"
            grep -q '^package/LICENSE-APACHE$' "$RUNNER_TEMP/files.txt"
            case "$name" in
              core) grep -q '^package/dist/cjs/Carburetor/index.js$' "$RUNNER_TEMP/files.txt" ;;
              lint) grep -q '^package/bin/carburetor-lint.js$' "$RUNNER_TEMP/files.txt" ;;
              *)
                grep -q '^package/carburetor-lint' "$RUNNER_TEMP/files.txt"
                grep -q '^package/THIRD-PARTY-LICENSES.txt$' "$RUNNER_TEMP/files.txt"
                ;;
            esac
          done

      # Platform packages first: the launcher's optionalDependencies must already resolve when
      # it appears. A version that is already on the registry is skipped, so a half-finished
      # run can simply be started again.
      - name: Publish
        run: |
          set -e
          flags=(--access public --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then
            flags+=(--dry-run)
          else
            flags+=(--provenance)
          fi
          for name in $PLATFORMS @react-carburetor/lint @react-carburetor/core; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "== $name@$VERSION is already published, skipping"
              continue
            fi
            echo "== publishing $name@$VERSION"
            npm publish "$(ls artifacts/${name##*/}/*.tgz)" "${flags[@]}"
          done

  # What was published must install and run from the registry on every supported platform.
  verify:
    name: Verify the published packages
    needs: [prepare, publish]
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/post-publish.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
