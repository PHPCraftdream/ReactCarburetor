name: Feature request
description: Propose a change to the public API, the lint rules or the documentation.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current API makes it hard.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or behaviour you have in mind, with a short usage example.
      render: tsx
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
