[package]
name = "carburetor-lint"
version = "0.1.0"
edition = "2021"
description = "Native checks for React Carburetor consumer code"
license = "MIT OR Apache-2.0"

# Pinned exactly: oxc's AST types change between minor versions, and an unpinned parser would
# break the rules silently rather than loudly.
[dependencies]
oxc_allocator = "=0.150.0"
oxc_ast = "=0.150.0"
oxc_ast_visit = "=0.150.0"
oxc_parser = "=0.150.0"
oxc_semantic = "=0.150.0"
oxc_span = "=0.150.0"
# Only for `ScopeFlags`, which `Visit::visit_function` takes and a rule has to forward. Already in
# the graph through oxc_ast, so naming it here costs nothing but has to be pinned with the rest.
oxc_syntax = "=0.150.0"
rayon = "=1.12.0"
# Style rules need one regex engine: max-line-length's ignorePattern is a user-supplied
# regex, and it has to behave the way the JavaScript rule's RegExp did.
regex = "=1.11.3"
ignore = "=0.4.33"
globset = "=0.4.20"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.release]
# A linter is short-lived: optimise for the run, not for the build.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
